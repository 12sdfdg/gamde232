<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
  
  <pattern id="plaidA" width="24" height="24" patternUnits="userSpaceOnUse">
    <rect width="24" height="24" fill="#c0392b"/>
    <rect width="24" height="9" fill="#1b1b1b" opacity=".55"/>
    <rect width="9" height="24" fill="#1b1b1b" opacity=".55"/>
  </pattern>
  
  <pattern id="plaidB" width="24" height="24" patternUnits="userSpaceOnUse">
    <rect width="24" height="24" fill="#d8341f"/>
    <rect width="24" height="9" fill="#1b1b1b" opacity=".55"/>
    <rect width="9" height="24" fill="#1b1b1b" opacity=".55"/>
  </pattern>
  <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0b1440"/><stop offset=".6" stop-color="#1d2f6b"/><stop offset="1" stop-color="#14365a"/>
  </linearGradient>
  <radialGradient id="moonGlow"><stop offset="0" stop-color="#e9f1ff" stop-opacity=".9"/><stop offset="1" stop-color="#9fb7ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="fireSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3a0a12"/><stop offset=".45" stop-color="#9c1d12"/><stop offset=".8" stop-color="#ff6a00"/><stop offset="1" stop-color="#ffb700"/>
  </linearGradient>
  <radialGradient id="impact" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset=".15" stop-color="#fff3a0" stop-opacity=".8"/><stop offset=".45" stop-color="#ffa000" stop-opacity=".45"/><stop offset="1" stop-color="#ff3d00" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff7c2"/><stop offset=".4" stop-color="#ffc21a"/><stop offset="1" stop-color="#ff5a00"/>
  </linearGradient>
  <linearGradient id="proText" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ff5a4a"/><stop offset="1" stop-color="#c80d0d"/>
  </linearGradient>
  <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fffbd0"/><stop offset=".5" stop-color="#ffd21a"/><stop offset="1" stop-color="#ff8a00"/>
  </linearGradient>
  <linearGradient id="bark" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5a3317"/><stop offset=".5" stop-color="#8a5328"/><stop offset="1" stop-color="#4a2810"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="9" result="b"/>
    <feFlood flood-color="#ff8a00"/><feComposite in2="b" operator="in" result="g"/>
    <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity=".6"/></filter>
  <clipPath id="leftSide"><polygon points="0,0 650,0 590,720 0,720"/></clipPath>
  <clipPath id="rightSide"><polygon points="650,0 1280,0 1280,720 590,720"/></clipPath>
  <style>
    .t  { font-family: 'Inter Display', 'Inter', sans-serif; font-weight: 900; paint-order: stroke; stroke-linejoin: round; }
    .pt { font-family: 'Inter Display', 'Inter', sans-serif; font-weight: 900; paint-order: stroke; stroke: #111; stroke-width: 10px; stroke-linejoin: round; }
  </style>
</defs>

